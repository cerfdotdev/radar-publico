# Proxy de /api/ na borda (nginx.conf), incluído em "location ^~ /api/" e em
# "location = /api/health". Daqui a requisição vai para a camada de admissão, que repassa ao
# backend; o cache fica aqui, então o que ele responde nunca chega à admissão.

# A API só tem GET (o HEAD vem junto, respondido pelo Flask): outro método leva 405 aqui, sem
# chegar ao backend. O "if" só com return é seguro dentro de location.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# Camada de admissão (nginx.conf): endereço fixo dentro do container, sem DNS.
proxy_pass http://127.0.0.1:8081;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Substitui o cabeçalho em vez de acrescentar, para o cliente não conseguir forjar o próprio IP
# (limite por IP no backend). Atrás de um proxy confiável (real-ip.conf), o $remote_addr já é o
# IP do cliente que esse proxy informou. A admissão repassa estes cabeçalhos sem mudar.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# A API não usa cookie: o de outro site do mesmo domínio não vai para o backend.
proxy_set_header Cookie "";

# A admissão responde antes: 504 aos 15 s sem resposta do backend, 503 sem vaga, 502 sem
# conexão. 20 s é o tempo do site (SEARCH_TIMEOUT_MS em src/api.ts): a borda só desistiria
# junto com o navegador, se a própria admissão travasse.
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 20s;

proxy_cache $api_cache;
proxy_cache_key $request_uri;
proxy_no_cache $api_nao_guardar;
# Buscas iguais ao mesmo tempo esperam a primeira em vez de irem todas ao backend. Até 5 s: com
# os 15 s de leitura da admissão, fica nos 20 s do frontend (SEARCH_TIMEOUT_MS). Depois disso a
# requisição vai ao backend sem guardar a resposta.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
# Resposta vencida: pergunta ao backend com o ETag, e o 304 dele não refaz a busca.
proxy_cache_revalidate on;
# Enquanto uma requisição atualiza a resposta vencida, ou se o backend falhar, estiver ocupado
# (inclusive o 503 da admissão sem vaga) ou demorar, as outras recebem a guardada em vez de
# esperar ou de um erro. O 429 não entra: o limite é de quem pediu, não da URL.
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
# HIT, MISS, EXPIRED, STALE, UPDATING ou REVALIDATED; ausente quando não há cache.
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/snippets/security-headers.conf;
