# Repasse ao Gunicorn na camada de admissão (nginx.conf), incluído nas duas locations dela.

# Variável no proxy_pass para a resolução sob demanda (ver resolver em nginx.conf). Custo aceito:
# sem keepalive com o upstream, cada requisição abre uma conexão nova com o Gunicorn.
set $backend "http://backend:5000";
proxy_pass $backend;

# A borda já trocou o X-Forwarded-For e o X-Real-IP pelo IP do cliente e tirou o Cookie; esses
# cabeçalhos passam como chegaram. Só o Host precisa ser repetido: sem ele, o nginx mandaria o
# do proxy_pass ("backend:5000").
proxy_set_header Host $host;

# Acima do statement_timeout do banco (5 s) mais a fila, que o corte de
# NGINX_LIMITE_BACKEND_SIMULTANEAS deixa em uma busca por thread. O Gunicorn (gthread) não corta
# requisição lenta, então este é o teto que o cliente vê: passou dele, a admissão responde 504.
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
