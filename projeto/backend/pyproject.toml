[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "gunicorn.conf.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
