name: Desktop (executável)

# Gera o executável do app desktop (PyInstaller, onedir) no Linux e no Windows, confere que
# ele abre (--verificar) e publica cada um como artefato da execução. Não é check
# obrigatório: o ci-ok do ci.yml continua sendo o único exigido na main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - projeto/desktop/**
      - .github/workflows/desktop-build.yml
  push:
    branches: [main]
    paths:
      - projeto/desktop/**
      - .github/workflows/desktop-build.yml

permissions: {}

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  # Dias em que o executável fica disponível para download na página da execução.
  RETENCAO_DIAS: 7

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: projeto/desktop
    env:
      # Qt sem tela: testes da janela e verificação do executável não abrem nada.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # O runner não traz as bibliotecas gráficas que o Qt carrega (libEGL, xkbcommon...).
      # As libxcb-* do plugin xcb precisam estar aqui para o PyInstaller copiá-las: sem elas,
      # o executável só abriria no X11 de quem já as tem instaladas. Xvfb: X11 sem tela.
      - name: Bibliotecas do sistema para o Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-util1 xvfb
      - name: Instalar ferramentas de CI (com hash verificado)
        run: pip install --require-hashes --no-deps -r ../../.github/ci/requirements.txt
      - name: Instalar dependências do desktop
        run: pip install -r requirements.txt
      - name: Instalar dependências de build (com hash verificado)
        run: pip install --require-hashes -r requirements-build.txt
      - name: Testes (pytest)
        run: python -m pytest -rs
      - name: Gerar o executável (PyInstaller, onedir)
        run: python build.py
      - name: Verificar o executável (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          ./dist/RadarPublico/RadarPublico --verificar
          # De novo num servidor X11 de verdade: confere o plugin xcb copiado para o executável.
          QT_QPA_PLATFORM=xcb xvfb-run -a ./dist/RadarPublico/RadarPublico --verificar
      # É um programa de janela: sem -Wait, o shell voltaria na hora com código 0.
      - name: Verificar o executável (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RadarPublico\RadarPublico.exe `
            -ArgumentList '--verificar' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput verificar.out -RedirectStandardError verificar.err
          # Saída redirecionada do Python no Windows vem na página de código ANSI.
          Get-Content -Encoding ansi verificar.out, verificar.err
          if ($null -eq $p.ExitCode) { exit 1 }
          exit $p.ExitCode
      - name: Tamanho do executável
        run: du -sh dist/RadarPublico
      # O zip do upload-artifact perde a permissão de execução: no Linux vai um .tar.gz.
      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf RadarPublico-Linux.tar.gz -C dist RadarPublico
      - name: Publicar o executável (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: projeto/desktop/RadarPublico-Linux.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: ${{ env.RETENCAO_DIAS }}
      - name: Publicar o executável (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadarPublico-Windows
          path: projeto/desktop/dist/RadarPublico
          if-no-files-found: error
          retention-days: ${{ env.RETENCAO_DIAS }}
