# Cabeçalhos de segurança de todas as respostas.
# Incluído no server e repetido em cada location que tem add_header próprio,
# porque um add_header dentro de uma location descarta os herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Tudo da própria origem, inclusive as fontes IBM Plex (servidas em /assets/).
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
