# Cabeçalhos de segurança de todas as respostas da borda (nginx.conf).
# Incluído no server e repetido em cada location que tem add_header próprio,
# porque um add_header dentro de uma location descarta os herdados do server.
# A camada de admissão não os inclui: as respostas dela passam pela borda, que acrescenta estes.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Só HTTPS por 1 ano (31.536.000 s), neste host e nos subdomínios dele. Vale pelo Traefik do
# Dokploy, que termina o TLS; por HTTP (localhost:8080) o navegador ignora o cabeçalho.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Outra origem aberta por esta página (ou que a abriu) não ganha acesso à janela (window.opener),
# e outros sites não carregam os arquivos e as respostas daqui em <img>, <script> ou fetch no-cors.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Tudo da própria origem, inclusive as fontes IBM Plex (servidas em /assets/). O site não usa
# <base>, <object>, frames nem envio de formulário para outro endereço. Trusted Types (Chrome e
# Edge): nenhum texto vira HTML ou script por innerHTML, eval e afins; o React monta a página
# sem eles (busca, similar, paginação e erros conferidos no navegador, sem violação).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
