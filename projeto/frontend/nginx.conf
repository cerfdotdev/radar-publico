# Servidor estático e proxy reverso do Radar Público (nginx sem privilégios, porta 8080).

# DNS interno do Docker. Com o proxy_pass em variável, "backend" é resolvido sob demanda:
# o nginx sobe mesmo antes do backend e reconsulta o IP a cada 10 s (container reiniciado).
resolver 127.0.0.11 valid=10s ipv6=off;
# Fora da rede do compose esse DNS não existe; falha em 2 s em vez dos 30 s padrão.
resolver_timeout 2s;

# Cache compartilhado da busca e do detalhe (docs/api.md, "Cache"). O tempo de vida é o
# max-age que o backend manda (API_CACHE_TTL_S); sem proxy_cache_valid, resposta sem max-age
# não é guardada. keys_zone de 2 MB guarda cerca de 16 mil chaves; acima de max_size o nginx
# apaga as menos usadas; o que ninguém pede em 10 min (inactive) sai mesmo se ainda valer.
# Fica na camada do container: some quando ele é recriado, mas não num restart.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:2m max_size=64m inactive=10m use_temp_path=off;

# Só GET /api/servidores e /api/servidores/<id> usam o cache; /api/health nunca.
# $api_cache_ligado vem de api-cache.conf, gerado na subida (API_CACHE_TTL_S=0 desliga).
map "$api_cache_ligado:$uri" $api_cache {
    "~^1:/api/servidores(/[^/]+)?$" api;
    default                          off;
}

# Só 200 e 404 entram no cache: com max-age, o nginx guardaria até um 429 ou um 500. O backend
# já manda no-store nesses; isto vale mesmo se ele mudar. As respostas do próprio nginx (502 e
# 504 em JSON, abaixo) não vêm do backend e nunca são guardadas.
map $upstream_status $api_nao_guardar {
    200     0;
    404     0;
    default 1;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: funcionam atrás de qualquer mapeamento de porta.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    # Abaixo de 1 KiB a compressão não compensa.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Assets com hash no nome nunca mudam: cache de 1 ano. Arquivo ausente é 404, não o index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html sempre revalidado, para o navegador pegar os assets novos depois de um build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Qualquer outro arquivo com extensão (favicon.ico, robots.txt...) que não exista é 404.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Rotas da SPA caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        # Variável no proxy_pass para a resolução sob demanda (ver resolver). Custo aceito:
        # sem keepalive com o upstream, cada requisição abre uma conexão nova com o Gunicorn.
        set $backend "http://backend:5000";
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui o cabeçalho em vez de acrescentar, para o cliente não conseguir forjar o
        # próprio IP (limite por IP no backend). Atrás de um proxy confiável (real-ip.conf),
        # o $remote_addr já é o IP do cliente que esse proxy informou.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Acima do statement_timeout do banco (5 s) mais fila. O Gunicorn (gthread) não corta
        # requisição lenta, então este é o teto que o cliente vê: passou dele, o nginx dá 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_cache $api_cache;
        proxy_cache_key $request_uri;
        proxy_no_cache $api_nao_guardar;
        # Buscas iguais ao mesmo tempo esperam a primeira em vez de irem todas ao backend. Até
        # 5 s: com os 15 s de leitura, fica nos 20 s do frontend (SEARCH_TIMEOUT_MS). Depois
        # disso a requisição vai ao backend sem guardar a resposta.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Resposta vencida: pergunta ao backend com o ETag, e o 304 dele não refaz a busca.
        proxy_cache_revalidate on;
        # Enquanto uma requisição atualiza a resposta vencida, ou se o backend falhar ou estiver
        # sobrecarregado, as outras recebem a guardada em vez de esperar ou de um erro. O 429
        # não entra: o limite é de quem pediu, não da URL.
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        # HIT, MISS, EXPIRED, STALE, UPDATING ou REVALIDATED; ausente quando não há cache.
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;

        # Só erros gerados pelo próprio nginx: as respostas do backend (inclusive 503 com
        # Retry-After) passam intactas, porque proxy_intercept_errors fica desligado. A exceção
        # é o proxy_cache_use_stale acima, que troca um 5xx por uma resposta vencida guardada.
        error_page 502 503 = @api_indisponivel;
        error_page 504 = @api_tempo_esgotado;
    }

    # Erros do proxy no formato de docs/api.md, em JSON.
    location @api_indisponivel {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 502 '{"error":{"code":"SERVIDOR_INDISPONIVEL","message":"A API está indisponível no momento. Tente de novo em instantes."}}';
    }

    location @api_tempo_esgotado {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 504 '{"error":{"code":"TEMPO_ESGOTADO","message":"A API demorou demais para responder. Tente de novo em instantes."}}';
    }
}
