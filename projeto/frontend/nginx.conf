# Servidor estático e proxy reverso do Radar Público (nginx sem privilégios, porta 8080).
#
# Este arquivo é um template: na subida, o entrypoint da imagem troca as variáveis NGINX_LIMITE_*
# pelos valores do ambiente (padrões em limites-borda.envsh) e grava o resultado em
# /etc/nginx/conf.d/default.conf.
#
# Duas camadas no mesmo nginx:
# - a borda, na porta 8080: o site, o cache da API, os limites por IP, os cabeçalhos de
#   segurança e os erros em JSON;
# - a admissão, em 127.0.0.1:8081 (só dentro do container): recebe da borda o que o cache não
#   respondeu e limita quantas requisições vão ao mesmo tempo ao Gunicorn. É separada porque o
#   limit_conn conta antes da consulta ao cache: na borda, cada HIT ocuparia uma vaga do backend.

# DNS interno do Docker. Com o proxy_pass em variável, "backend" é resolvido sob demanda:
# o nginx sobe mesmo antes do backend e reconsulta o IP a cada 10 s (container reiniciado).
resolver 127.0.0.11 valid=10s ipv6=off;
# Fora da rede do compose esse DNS não existe; falha em 2 s em vez dos 30 s padrão.
resolver_timeout 2s;

# Cache compartilhado da busca e do detalhe (docs/api.md, "Cache"). O tempo de vida é o
# max-age que o backend manda (API_CACHE_TTL_S); sem proxy_cache_valid, resposta sem max-age
# não é guardada. keys_zone de 2 MB guarda cerca de 16 mil chaves; acima de max_size o nginx
# apaga as menos usadas; o que ninguém pede em 10 min (inactive) sai mesmo se ainda valer.
# Fica num volume (docker-compose.yml), esvaziado a cada subida (limpar-cache.sh). Não num
# tmpfs: o gerenciador do cache só confere o max_size de tempos em tempos (até 10 s), e uma
# enxurrada de buscas distintas enchia o tmpfs antes disso; sem espaço, o nginx fecha a conexão
# sem resposta. Em disco, o excesso dura até a próxima conferência e não derruba nada.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:2m max_size=64m inactive=10m use_temp_path=off;

# Só GET /api/servidores e /api/servidores/<id> usam o cache; /api/health nunca.
# $api_cache_ligado vem de api-cache.conf, gerado na subida (API_CACHE_TTL_S=0 desliga).
map "$api_cache_ligado:$uri" $api_cache {
    "~^1:/api/servidores(/[^/]+)?$" api;
    default                          off;
}

# Só 200 e 404 entram no cache: com max-age, o nginx guardaria até um 429 ou um 500. O backend
# já manda no-store nesses; isto vale mesmo se ele mudar. As respostas de erro do próprio nginx
# (JSON, abaixo) também têm no-store e nunca são guardadas.
map $upstream_status $api_nao_guardar {
    200     0;
    404     0;
    default 1;
}

# Borda: a porta publicada.
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: funcionam atrás de qualquer mapeamento de porta.
    absolute_redirect off;

    # Clientes lentos. Um navegador manda o cabeçalho inteiro de uma vez; 10 s cobrem uma rede
    # móvel ruim e cortam quem abre conexões e manda o cabeçalho aos poucos para segurá-las
    # (slowloris). O site e a API só aceitam GET, então não há corpo para esperar.
    client_header_timeout 10s;
    client_body_timeout 10s;
    # Cliente que para de ler a resposta por 10 s perde a conexão.
    send_timeout 10s;
    # Conexão ociosa entre duas requisições: 15 s, em vez dos 65 s da imagem.
    keepalive_timeout 15s;
    # Conexão encerrada por tempo esgotado sai com RST e libera a memória dela na hora.
    reset_timedout_connection on;

    # Tamanho das requisições. Só GET: um corpo acima de 1 KiB é 413 (0 desligaria o limite).
    client_max_body_size 1k;
    # A linha da requisição e cada cabeçalho até 3 KiB. A maior busca válida (similar, cargo e
    # órgão com 100 caracteres acentuados cada, em %XX) fica em ~2 KiB, assim como o Referer
    # com a mesma busca na URL do site. Acima disso, 414 ou 431 em JSON, e nada passa dos
    # 4.094 bytes que o Gunicorn aceita na linha (ele responderia 400 em HTML).
    large_client_header_buffers 4 3k;

    include /etc/nginx/snippets/security-headers.conf;

    # Erros gerados pelo próprio nginx, em JSON no formato de docs/api.md (locations /_erro/
    # abaixo). As respostas do backend passam intactas, porque proxy_intercept_errors fica
    # desligado; a exceção é o proxy_cache_use_stale (api-borda.conf), que troca um 5xx por uma
    # resposta vencida guardada. Valem em toda location, que não define error_page própria; 400,
    # 414 e 494 (cabeçalho grande, que vira 431) acontecem antes de escolher a location, sem URI
    # ainda: por isso URIs internas, e não locations nomeadas (@), que o nginx recusa sem URI.
    error_page 400 /_erro/400;
    error_page 405 /_erro/405;
    error_page 413 /_erro/413;
    error_page 414 /_erro/414;
    error_page 494 =431 /_erro/431;
    error_page 429 /_erro/429;
    error_page 500 /_erro/500;
    error_page 502 /_erro/502;
    error_page 504 /_erro/504;

    gzip on;
    gzip_vary on;
    # Abaixo de 1 KiB a compressão não compensa.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Assets com hash no nome nunca mudam: cache de 1 ano. Arquivo ausente é 404, não o index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html sempre revalidado, para o navegador pegar os assets novos depois de um build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Qualquer outro arquivo com extensão (favicon.ico, robots.txt...) que não exista é 404.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Rotas da SPA caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        # Limites por IP (zonas em limites-borda.conf; NGINX_LIMITE_IP=0 desliga). Contam
        # também o que o cache responde: seguram uma enxurrada antes do cache e do Gunicorn. O
        # limite por minuto do backend (RATE_LIMIT_REQUESTS) continua valendo para o que passa.
        # Taxa média por IP e rajada que passa na hora (nodelay); acima disso, 429.
        limit_req zone=api_ip_taxa burst=${NGINX_LIMITE_IP_RAJADA} nodelay;
        # Requisições do mesmo IP em andamento; acima disso, 429.
        limit_conn api_ip_simultaneas ${NGINX_LIMITE_IP_SIMULTANEAS};
        limit_req_status 429;
        limit_conn_status 429;
        include /etc/nginx/snippets/api-borda.conf;
    }

    # Fora dos limites por IP: o healthcheck, o smoke test do CI e monitores nunca levam 429.
    # Na admissão ele tem uma fila própria e pequena, então uma enxurrada de /api/health não
    # chega solta ao Gunicorn.
    location = /api/health {
        include /etc/nginx/snippets/api-borda.conf;
    }

    location = /_erro/400 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 400 '{"error":{"code":"PARAMETRO_INVALIDO","message":"Requisição inválida."}}';
    }

    location = /_erro/405 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Allow "GET, HEAD" always;
        return 405 '{"error":{"code":"METODO_NAO_PERMITIDO","message":"Método não permitido."}}';
    }

    location = /_erro/413 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"error":{"code":"PARAMETRO_INVALIDO","message":"A API só aceita GET, sem corpo na requisição."}}';
    }

    location = /_erro/414 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 414 '{"error":{"code":"PARAMETRO_INVALIDO","message":"O endereço da requisição é longo demais."}}';
    }

    location = /_erro/431 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 431 '{"error":{"code":"PARAMETRO_INVALIDO","message":"Os cabeçalhos da requisição são grandes demais."}}';
    }

    location = /_erro/429 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        # Na taxa padrão uma vaga abre a cada 0,1 s, e uma requisição em andamento termina em
        # milissegundos: 1 s, o menor valor inteiro do cabeçalho, basta.
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"MUITAS_REQUISICOES","message":"Muitas requisições em pouco tempo. Aguarde e tente de novo."}}';
    }

    location = /_erro/500 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 500 '{"error":{"code":"ERRO_INTERNO","message":"Algo deu errado do nosso lado. Tente de novo em instantes."}}';
    }

    location = /_erro/502 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 502 '{"error":{"code":"SERVIDOR_INDISPONIVEL","message":"A API está indisponível no momento. Tente de novo em instantes."}}';
    }

    location = /_erro/504 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        include /etc/nginx/snippets/security-headers.conf;
        return 504 '{"error":{"code":"TEMPO_ESGOTADO","message":"A API demorou demais para responder. Tente de novo em instantes."}}';
    }
}

# Admissão: só a borda chega aqui (127.0.0.1, dentro do container), e só com o que o cache não
# respondeu. Sem cabeçalhos de segurança nem log de acesso: a resposta volta pela borda, que
# acrescenta os cabeçalhos e registra a requisição.
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    access_log off;

    # Requisições ao mesmo tempo no Gunicorn (zona em limites-borda.conf; NGINX_LIMITE_BACKEND=0
    # desliga). Acima disso, 503 SERVIDOR_OCUPADO na hora, em vez de esperar na fila do Gunicorn
    # até o 504; a borda entrega a resposta vencida do cache, se tiver uma.
    limit_conn api_backend ${NGINX_LIMITE_BACKEND_SIMULTANEAS};
    limit_conn_status 503;

    error_page 500 /_erro/500;
    error_page 502 /_erro/502;
    error_page 503 /_erro/503;
    error_page 504 /_erro/504;

    location / {
        include /etc/nginx/snippets/api-admissao.conf;
    }

    location = /api/health {
        # Fila própria, no lugar da das buscas: o health não disputa as vagas delas, e uma
        # enxurrada dele ocupa no máximo 4 conexões do Gunicorn. 4 cobrem alguns monitores
        # externos (uma sonda por vez cada), mesmo com a sonda esperando uma busca na fila.
        limit_conn api_health 4;
        include /etc/nginx/snippets/api-admissao.conf;
    }

    location = /_erro/500 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        return 500 '{"error":{"code":"ERRO_INTERNO","message":"Algo deu errado do nosso lado. Tente de novo em instantes."}}';
    }

    location = /_erro/502 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        return 502 '{"error":{"code":"SERVIDOR_INDISPONIVEL","message":"A API está indisponível no momento. Tente de novo em instantes."}}';
    }

    location = /_erro/503 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        # O mesmo do backend com o pool cheio (BUSY_RETRY_AFTER_S em app/errors.py).
        add_header Retry-After 2 always;
        return 503 '{"error":{"code":"SERVIDOR_OCUPADO","message":"O servidor está ocupado no momento. Tente de novo em instantes."}}';
    }

    location = /_erro/504 {
        internal;
        include /etc/nginx/snippets/erro-json.conf;
        return 504 '{"error":{"code":"TEMPO_ESGOTADO","message":"A API demorou demais para responder. Tente de novo em instantes."}}';
    }
}
